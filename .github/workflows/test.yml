name: Новости шумят — сводка

on:
  workflow_dispatch:

  schedule:
    - cron: "5 9 * * *"
      timezone: "Europe/Madrid"
    - cron: "5 18 * * *"
      timezone: "Europe/Madrid"

permissions:
  contents: write

concurrency:
  group: news-shumyat-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and publish digest
        run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Save publication history
        if: always() && hashFiles('data/sent_news.json') != ''
        run: |
          if git diff --quiet -- data/sent_news.json; then
            echo "No sent-news changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent_news.json
          git commit -m "Update sent news history"
          git pull --rebase origin main
          git push origin HEAD:main
